<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Solar</title>
<style>
:root{--bg:#07090c;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.08);--txt:#eef1f5;--dim:#8a93a0;--sun:#ffb23e;--sun2:#ff7a1a;--good:#45d39a;--bad:#ff6b5e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));overflow:hidden}
#orb{position:fixed;inset:0;z-index:0;pointer-events:none}
header,#panel,#log,#chips,#composer{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--sun)}
#age{font-size:12px;color:var(--dim)}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer}
.top{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.08em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.tile{background:rgba(255,255,255,.035);border-radius:14px;padding:8px 10px}
.tile span{display:block;font-size:11px;color:var(--dim);letter-spacing:.04em}
.tile strong{font-size:17px;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:11px}
#detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--dim);grid-template-columns:1fr 1fr 1fr;gap:6px}
#panel.open #detail{display:grid}
#detail div strong{display:block;color:var(--txt);font-size:15px}
#log{flex:1;overflow-y:auto;padding:16px 2px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:88%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;animation:in .25s ease}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--sun),var(--sun2));color:#1a0e00;border-bottom-right-radius:6px}
.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;backdrop-filter:blur(12px)}
.a.think{color:var(--dim);font-style:italic}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 13px;font-size:13px}
#composer{display:flex;gap:8px;align-items:flex-end}
#q{flex:1;resize:none;max-height:120px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:22px;padding:13px 16px;font:inherit;outline:none}
#q:focus{border-color:rgba(255,178,62,.5)}
.btn{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--txt);border:1px solid var(--line);font-size:20px}
#mic{background:radial-gradient(circle at 35% 30%,#ffd37a,var(--sun2));color:#1a0e00;border:none;box-shadow:0 0 24px rgba(255,140,40,.35)}
#mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,140,40,0),0 0 36px rgba(255,140,40,.6)}}
#mute.off{opacity:.4}
.err{color:var(--bad)}
</style>
</head>
<body>
<canvas id="orb"></canvas>
<header><h1>☀ Solar</h1><span id="age">connecting…</span></header>

<section id="panel" aria-label="Live system">
  <div class="top">
    <div class="ring">
      <svg width="96" height="96"><circle cx="48" cy="48" r="41" stroke="rgba(255,255,255,.08)" stroke-width="8" fill="none"/><circle id="arc" cx="48" cy="48" r="41" stroke="#45d39a" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="257.6" stroke-dashoffset="257.6" style="transition:stroke-dashoffset .8s"/></svg>
      <b id="soc">--</b><small id="batState">BATTERY</small>
    </div>
    <div class="tiles">
      <div class="tile"><span>SOLAR</span><strong id="solar">--</strong></div>
      <div class="tile"><span>HOUSE</span><strong id="load">--</strong></div>
      <div class="tile"><span>GRID</span><strong id="grid">--</strong> <em id="gridState"></em></div>
      <div class="tile"><span>BATTERY</span><strong id="bat">--</strong> <em id="batFlow"></em></div>
    </div>
  </div>
  <div id="detail">
    <div>String 1<strong id="s1">--</strong></div>
    <div>String 2<strong id="s2">--</strong></div>
    <div>Sunny Boy<strong id="sb">--</strong></div>
    <div>Made today<strong id="tMade">--</strong></div>
    <div>Bought today<strong id="tBuy">--</strong></div>
    <div>Sold today<strong id="tSell">--</strong></div>
  </div>
</section>

<div id="log"></div>
<div id="chips"></div>
<form id="composer">
  <button type="button" class="btn" id="mute" title="Speak replies">🔊</button>
  <textarea id="q" rows="1" placeholder="Ask about your solar…"></textarea>
  <button type="button" class="btn" id="mic" title="Talk">🎤</button>
</form>

<script>
const params = new URLSearchParams(location.search);
let KEY = params.get("key");
try { if (KEY) localStorage.setItem("solarKey", KEY); else KEY = localStorage.getItem("solarKey"); } catch {}
const $ = (id) => document.getElementById(id);
const W = (n) => n == null ? "--" : Math.abs(n) >= 1000 ? (Math.abs(n) / 1000).toFixed(2) + " kW" : Math.round(Math.abs(n)) + " W";

let lastAt = 0, energy = 0.3;
async function refresh() {
  if (!KEY) { $("age").textContent = "missing key"; return; }
  try {
    const r = await fetch("/api/live?key=" + encodeURIComponent(KEY));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    const L = d.live;
    $("soc").textContent = Math.round(L.battery_percent) + "%";
    const arc = $("arc");
    arc.style.strokeDashoffset = 257.6 * (1 - L.battery_percent / 100);
    arc.style.stroke = L.battery_percent > 50 ? "#45d39a" : L.battery_percent > 20 ? "#ffb23e" : "#ff6b5e";
    $("batState").textContent = L.battery_meaning.toUpperCase();
    $("solar").textContent = W(L.solar_total_w);
    $("load").textContent = W(L.house_load_w);
    $("grid").textContent = W(L.grid_w);
    $("gridState").textContent = L.grid_meaning;
    $("gridState").style.color = L.grid_w > 0 ? "#ff6b5e" : L.grid_w < 0 ? "#45d39a" : "#8a93a0";
    $("bat").textContent = W(L.battery_w);
    $("batFlow").textContent = L.battery_meaning;
    $("batFlow").style.color = L.battery_w < 0 ? "#45d39a" : "#ffb23e";
    $("s1").textContent = W(L.alphaess_string1_w);
    $("s2").textContent = W(L.alphaess_string2_w);
    $("sb").textContent = W(L.sunny_boy_w);
    if (d.today) {
      $("tMade").textContent = d.today.solar_made_kwh + " kWh";
      $("tBuy").textContent = d.today.bought_from_grid_kwh + " kWh";
      $("tSell").textContent = d.today.sold_to_grid_kwh + " kWh";
    }
    energy = Math.min(1, 0.15 + (L.solar_total_w || 0) / 8000);
    lastAt = Date.now();
  } catch (e) {
    $("age").textContent = "offline: " + e.message;
  }
}
setInterval(() => { if (lastAt) $("age").textContent = "updated " + Math.round((Date.now() - lastAt) / 1000) + "s ago"; }, 1000);
setInterval(refresh, 30000);
refresh();
$("panel").onclick = () => $("panel").classList.toggle("open");

const cv = $("orb"), cx = cv.getContext("2d");
let busy = 0, t = 0;
const P = Array.from({ length: 140 }, () => ({ a: Math.random() * 6.28, r: Math.random(), s: 0.002 + Math.random() * 0.006, z: Math.random() }));
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
(function draw() {
  t += 1;
  const w = cv.width, h = cv.height, ox = w / 2, oy = h * 0.55, R = Math.min(w, h) * (0.22 + busy * 0.06);
  cx.clearRect(0, 0, w, h);
  const g = cx.createRadialGradient(ox, oy, 0, ox, oy, R * 1.8);
  g.addColorStop(0, `rgba(255,170,60,${0.10 + energy * 0.12 + busy * 0.1})`);
  g.addColorStop(1, "rgba(255,120,30,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, w, h);
  for (const p of P) {
    p.a += p.s * (1 + busy * 3);
    const wob = 1 + Math.sin(t * 0.02 + p.a * 3) * 0.08 * (1 + busy * 2);
    const rr = R * (0.35 + p.r * 0.75) * wob;
    const x = ox + Math.cos(p.a) * rr, y = oy + Math.sin(p.a) * rr * 0.9;
    cx.fillStyle = `rgba(255,${150 + p.z * 80},${60 + p.z * 60},${0.25 + p.z * 0.5})`;
    cx.beginPath(); cx.arc(x, y, (0.6 + p.z * 1.6) * devicePixelRatio, 0, 6.28); cx.fill();
  }
  requestAnimationFrame(draw);
})();

const log = $("log"), q = $("q"), hist = [];
let speak = true;
try { speak = localStorage.getItem("solarSpeak") !== "0"; } catch {}
$("mute").classList.toggle("off", !speak);
$("mute").onclick = () => { speak = !speak; $("mute").classList.toggle("off", !speak); try { speechSynthesis.cancel(); localStorage.setItem("solarSpeak", speak ? "1" : "0"); } catch {} };
function add(cls, text) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
function say(text) {
  if (!speak || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices();
  u.voice = v.find((x) => /en-AU/i.test(x.lang) && /natural|google/i.test(x.name)) || v.find((x) => /en-AU/i.test(x.lang)) || null;
  u.lang = "en-AU"; u.rate = 1.02;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
async function ask(text) {
  text = text.trim(); if (!text || busy) return;
  add("u", text); hist.push({ role: "user", content: text }); q.value = "";
  const th = add("a think", "checking your system…"); busy = 1;
  try {
    const r = await fetch("/api/chat?key=" + encodeURIComponent(KEY), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: hist }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    th.className = "m a"; th.textContent = d.reply;
    hist.push({ role: "assistant", content: d.reply });
    say(d.reply);
    if (d.tools && d.tools.includes("get_live_power")) refresh();
  } catch (e) {
    th.className = "m a err"; th.textContent = "Couldn't answer: " + e.message;
    hist.pop();
  }
  busy = 0;
}
$("composer").onsubmit = (e) => { e.preventDefault(); ask(q.value); };
q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; });
["How's the battery going?", "Will I last the night?", "How much did I buy from the grid today?", "When did I import power yesterday?", "Is the Sunny Boy pulling its weight?"]
  .forEach((c) => { const b = document.createElement("button"); b.type = "button"; b.textContent = c; b.onclick = () => ask(c); $("chips").appendChild(b); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("mic").style.display = "none";
else {
  const rec = new SR(); rec.lang = "en-AU"; rec.interimResults = true;
  let heard = "";
  rec.onresult = (e) => { heard = [...e.results].map((r) => r[0].transcript).join(""); q.value = heard; };
  rec.onend = () => { $("mic").classList.remove("on"); if (heard) ask(heard); heard = ""; };
  $("mic").onclick = () => { try { speechSynthesis.cancel(); } catch {} if ($("mic").classList.contains("on")) rec.stop(); else { $("mic").classList.add("on"); rec.start(); } };
}
add("a", "G'day Dave. Ask me anything about the solar, or tap the mic and just talk.");
</script>
</body>
</html>
